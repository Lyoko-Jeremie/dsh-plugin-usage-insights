- insert:
    - id: usage-insights
      name: dsh-usage-insights
      config:
        stepHistory: 200
        stepWindow: 200
        bandDays: 90
        useBuiltinHolidays: true
        holidays: []
        holidayRanges: []
        holidaySync:
          enabled: false
          urlTemplate: 'https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/{year}.json'
          years: []
          timeoutMs: 4000
